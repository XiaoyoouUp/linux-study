<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0d1b2e">
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7b8ca0"/></marker></defs>
  <rect x="0" y="0" width="860" height="440" fill="#ffffff"/>
  <text x="30" y="34" font-size="15" font-weight="bold">分层架构：用户 → Shell → 内核 → 硬件</text>
  <rect x="80" y="60" width="480" height="54" rx="8" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="320" y="92" text-anchor="middle">用户（敲命令 / 运行脚本）</text>
  <line x1="320" y1="116" x2="320" y2="142" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="80" y="146" width="480" height="66" rx="8" fill="#E8F7EE" stroke="#159A48" stroke-width="2"/>
  <text x="320" y="172" font-weight="bold" text-anchor="middle">Shell（bash）—— 命令解释器<tspan x="320" dy="22" font-weight="normal">把用户命令翻译成对内核的调用</tspan></text>
  <line x1="320" y1="216" x2="320" y2="242" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="80" y="246" width="480" height="66" rx="8" fill="#0d1b2e"/>
  <text x="320" y="272" font-weight="bold" fill="#ffffff" text-anchor="middle">内核（Kernel）<tspan x="320" dy="22" fill="#E8F7EE" font-weight="normal">系统调用 · 进程 · 内存 · 文件系统</tspan></text>
  <line x1="320" y1="316" x2="320" y2="342" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="80" y="346" width="480" height="54" rx="8" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="320" y="378" text-anchor="middle">硬件：CPU · 内存 · 磁盘 · 网卡</text>
  <rect x="600" y="60" width="230" height="340" rx="10" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="615" y="88" font-weight="bold">Shell 的职责</text>
  <text x="615" y="120" font-weight="bold">解析命令<tspan x="615" dy="20" font-weight="normal" fill="#7b8ca0">拆分参数、展开通配符</tspan></text>
  <text x="615" y="168" font-weight="bold">执行程序<tspan x="615" dy="20" font-weight="normal" fill="#7b8ca0">内建命令或外部程序</tspan></text>
  <text x="615" y="216" font-weight="bold">编写脚本<tspan x="615" dy="20" font-weight="normal" fill="#7b8ca0">变量、条件、循环控制</tspan></text>
  <text x="615" y="264" font-weight="bold">管理环境<tspan x="615" dy="20" font-weight="normal" fill="#7b8ca0">PATH 等环境变量与别名</tspan></text>
  <text x="80" y="428">Shell 不直接操作硬件：一切请求经系统调用进入内核，由内核驱动硬件完成。</text>
</svg>
