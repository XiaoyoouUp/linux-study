<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0d1b2e">
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7b8ca0"/></marker></defs>
  <rect x="0" y="0" width="860" height="450" fill="#ffffff"/>
  <text x="30" y="34" font-size="15" font-weight="bold">硬链接与符号链接（ln / ln -s）</text>
  <rect x="40" y="60" width="380" height="240" rx="10" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="60" y="88" font-weight="bold">硬链接：同一 inode 的两个名字</text>
  <rect x="60" y="104" width="110" height="38" rx="8" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="115" y="128" text-anchor="middle">文件名 A</text>
  <rect x="210" y="104" width="110" height="38" rx="8" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="265" y="128" text-anchor="middle">文件名 B</text>
  <rect x="100" y="184" width="180" height="46" rx="8" fill="#E8F7EE" stroke="#159A48" stroke-width="2"/>
  <text x="190" y="206" font-weight="bold" text-anchor="middle">inode 1234<tspan x="190" dy="18" font-weight="normal">链接计数 = 2</tspan></text>
  <rect x="100" y="256" width="180" height="36" rx="8" fill="#0d1b2e"/>
  <text x="190" y="279" fill="#ffffff" text-anchor="middle">数据块</text>
  <line x1="115" y1="142" x2="158" y2="182" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="265" y1="142" x2="222" y2="182" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="190" y1="230" x2="190" y2="254" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="440" y="60" width="380" height="240" rx="10" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="460" y="88" font-weight="bold">符号链接：存路径的独立文件</text>
  <rect x="460" y="104" width="110" height="38" rx="8" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="515" y="128" text-anchor="middle">link.txt</text>
  <rect x="460" y="184" width="180" height="46" rx="8" fill="#E8F7EE" stroke="#159A48" stroke-width="2"/>
  <text x="550" y="206" font-weight="bold" text-anchor="middle">inode 5678<tspan x="550" dy="18" font-weight="normal">内容 = file.txt 的路径</tspan></text>
  <rect x="460" y="256" width="180" height="36" rx="8" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="550" y="279" text-anchor="middle">file.txt（原文件）</text>
  <line x1="515" y1="142" x2="515" y2="182" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="550" y1="230" x2="550" y2="254" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="40" y="326" width="780" height="104" rx="10" fill="#E8F7EE" stroke="#159A48" stroke-width="1.5"/>
  <text x="60" y="356">硬链接：不能跨分区；删除原文件后，数据仍可通过另一个名字访问。</text>
  <text x="60" y="382">符号链接：可跨分区、可指向目录；原文件删除后成悬空链接，访问报错。</text>
  <text x="60" y="408" fill="#7b8ca0">ln 不能对目录建硬链接；ln -s 可以。</text>
</svg>
