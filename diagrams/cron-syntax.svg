<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0d1b2e">
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7b8ca0"/></marker></defs>
  <rect x="0" y="0" width="860" height="500" fill="#ffffff"/>
  <text x="30" y="34" font-size="15" font-weight="bold">crontab 五字段语法：分 时 日 月 周</text>
  <rect x="40" y="60" width="140" height="78" rx="10" fill="#E8F7EE" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="110" y="88" text-anchor="middle" font-weight="bold">分（分钟）<tspan x="110" dy="22" fill="#7b8ca0" font-weight="normal">0–59</tspan></text>
  <rect x="200" y="60" width="140" height="78" rx="10" fill="#E8F7EE" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="270" y="88" text-anchor="middle" font-weight="bold">时（小时）<tspan x="270" dy="22" fill="#7b8ca0" font-weight="normal">0–23</tspan></text>
  <rect x="360" y="60" width="140" height="78" rx="10" fill="#E8F7EE" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="430" y="88" text-anchor="middle" font-weight="bold">日（日期）<tspan x="430" dy="22" fill="#7b8ca0" font-weight="normal">1–31</tspan></text>
  <rect x="520" y="60" width="140" height="78" rx="10" fill="#E8F7EE" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="590" y="88" text-anchor="middle" font-weight="bold">月（月份）<tspan x="590" dy="22" fill="#7b8ca0" font-weight="normal">1–12</tspan></text>
  <rect x="680" y="60" width="140" height="78" rx="10" fill="#E8F7EE" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="750" y="88" text-anchor="middle" font-weight="bold">周（星期）<tspan x="750" dy="22" fill="#7b8ca0" font-weight="normal">0–7（0=周日）</tspan></text>
  <rect x="40" y="158" width="780" height="46" rx="10" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="60" y="187"><tspan font-weight="bold">特殊符号：</tspan><tspan fill="#159A48" font-weight="bold"> * </tspan>任意值<tspan fill="#7b8ca0">　　</tspan><tspan fill="#159A48" font-weight="bold">, </tspan>多个值<tspan fill="#7b8ca0">　　</tspan><tspan fill="#159A48" font-weight="bold">- </tspan>范围<tspan fill="#7b8ca0">　　</tspan><tspan fill="#159A48" font-weight="bold">/ </tspan>步长（*/10 = 每 10 分钟一次）</text>
  <rect x="40" y="224" width="780" height="96" rx="10" fill="#0d1b2e"/>
  <text y="252"><tspan x="110" text-anchor="middle" fill="#F0B429" font-weight="bold">0</tspan><tspan x="270" text-anchor="middle" fill="#F0B429" font-weight="bold">2</tspan><tspan x="430" text-anchor="middle" fill="#F0B429" font-weight="bold">*</tspan><tspan x="590" text-anchor="middle" fill="#F0B429" font-weight="bold">*</tspan><tspan x="750" text-anchor="middle" fill="#F0B429" font-weight="bold">*</tspan></text>
  <text x="60" y="278" fill="#E8F7EE">→ 每天 02:00 执行 /home/student/scripts/backup.sh</text>
  <text x="60" y="302" fill="#7b8ca0">crontab -e 编辑、crontab -l 查看；执行记录见 /var/log/cron</text>
  <rect x="40" y="344" width="780" height="80" rx="10" fill="#0d1b2e"/>
  <text y="372"><tspan x="110" text-anchor="middle" fill="#F0B429" font-weight="bold">*/10</tspan><tspan x="270" text-anchor="middle" fill="#F0B429" font-weight="bold">*</tspan><tspan x="430" text-anchor="middle" fill="#F0B429" font-weight="bold">*</tspan><tspan x="590" text-anchor="middle" fill="#F0B429" font-weight="bold">*</tspan><tspan x="750" text-anchor="middle" fill="#F0B429" font-weight="bold">*</tspan></text>
  <text x="60" y="396" fill="#E8F7EE">→ 每 10 分钟一次：df -h &gt;&gt; /home/student/df.log</text>
  <text x="60" y="416" fill="#7b8ca0">*/10 = 从 0 开始每隔 10 分钟执行一次（0,10,20,…,50）</text>
  <text x="30" y="470" fill="#7b8ca0">五列按「分 时 日 月 周」顺序取值；背后是 crond 服务：systemctl status crond 确认它在运行。</text>
</svg>
