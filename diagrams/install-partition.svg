<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0d1b2e">
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7b8ca0"/></marker></defs>
  <rect x="0" y="0" width="860" height="440" fill="#ffffff"/>
  <text x="30" y="34" font-size="15" font-weight="bold">RHEL 安装：磁盘分区与 LVM 布局</text>
  <rect x="60" y="60" width="240" height="300" rx="10" fill="#ffffff" stroke="#0d1b2e" stroke-width="1.5"/>
  <text x="180" y="86" font-weight="bold" text-anchor="middle">磁盘 /dev/sda</text>
  <rect x="75" y="100" width="210" height="54" rx="6" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="180" y="121" text-anchor="middle" font-weight="bold">sda1 · /boot<tspan x="180" dy="19" font-weight="normal" fill="#159A48">xfs · 1 GiB · 标准分区</tspan></text>
  <rect x="75" y="170" width="210" height="174" rx="6" fill="#E8F7EE" stroke="#159A48" stroke-width="2"/>
  <text x="180" y="200" text-anchor="middle" font-weight="bold">sda2 · LVM 物理卷（PV）<tspan x="180" dy="20" font-weight="normal">剩余全部磁盘空间</tspan><tspan x="180" dy="20" fill="#159A48">供卷组 rhel 使用</tspan></text>
  <line x1="302" y1="257" x2="392" y2="257" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="400" y="80" width="420" height="300" rx="10" fill="#ffffff" stroke="#159A48" stroke-width="2"/>
  <text x="610" y="106" font-weight="bold" fill="#159A48" text-anchor="middle">卷组（VG）：rhel</text>
  <rect x="430" y="124" width="360" height="66" rx="8" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="610" y="149" text-anchor="middle" font-weight="bold">rhel-swap → swap<tspan x="610" dy="20" font-weight="normal" fill="#7b8ca0">建议 2~4 GiB（与内存相当）</tspan></text>
  <rect x="430" y="206" width="360" height="72" rx="8" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="610" y="232" text-anchor="middle" font-weight="bold">rhel-root → /<tspan x="610" dy="20" font-weight="normal" fill="#7b8ca0">xfs · 建议 ≥ 20 GiB（系统+软件）</tspan></text>
  <rect x="430" y="294" width="360" height="68" rx="8" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="610" y="320" text-anchor="middle" font-weight="bold">rhel-home → /home<tspan x="610" dy="20" font-weight="normal" fill="#7b8ca0">xfs · 使用剩余空间</tspan></text>
  <text x="60" y="404">要点：/boot 必须是标准分区，不放入 LVM；<tspan x="60" dy="21">/、/home、swap 位于 LVM 逻辑卷上，考试扩容思路：lvextend + xfs_growfs。</tspan></text>
</svg>
