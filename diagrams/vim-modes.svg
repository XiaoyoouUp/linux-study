<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0d1b2e">
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7b8ca0"/></marker></defs>
  <rect x="0" y="0" width="860" height="450" fill="#ffffff"/>
  <text x="30" y="34" font-size="15" font-weight="bold">vim 三种模式与切换</text>
  <rect x="60" y="120" width="180" height="70" rx="10" fill="#E8F7EE" stroke="#159A48" stroke-width="2"/>
  <text x="150" y="148" font-weight="bold" text-anchor="middle">插入模式<tspan x="150" dy="22" font-weight="normal">输入 / 修改文本</tspan></text>
  <rect x="350" y="120" width="180" height="70" rx="10" fill="#0d1b2e"/>
  <text x="440" y="148" font-weight="bold" fill="#ffffff" text-anchor="middle">普通模式<tspan x="440" dy="22" fill="#E8F7EE" font-weight="normal">移动·复制·删除·搜索</tspan></text>
  <rect x="640" y="120" width="180" height="70" rx="10" fill="#F0B429"/>
  <text x="730" y="148" font-weight="bold" text-anchor="middle">末行模式<tspan x="730" dy="22" font-weight="normal">保存·退出·替换</tspan></text>
  <line x1="345" y1="144" x2="245" y2="144" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="295" y="132" fill="#159A48" text-anchor="middle" font-weight="bold">i / a / o</text>
  <line x1="245" y1="178" x2="345" y2="178" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="295" y="198" text-anchor="middle" font-weight="bold">Esc</text>
  <line x1="535" y1="144" x2="635" y2="144" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="585" y="132" fill="#159A48" text-anchor="middle" font-weight="bold">输入冒号 :</text>
  <line x1="635" y1="178" x2="535" y2="178" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="585" y="198" text-anchor="middle" font-weight="bold">Esc / 执行完</text>
  <rect x="60" y="230" width="740" height="160" rx="10" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="80" y="258" font-weight="bold">普通模式常用键（先按 Esc 确保在普通模式）</text>
  <text x="80" y="290">dd：剪切整行　p：粘贴到下方</text>
  <text x="450" y="290">yy：复制整行　u：撤销</text>
  <text x="80" y="322">/关键字：向下搜索　n：下一个</text>
  <text x="450" y="322">x：删一个字符　G：跳到文件尾</text>
  <text x="80" y="354">gg：跳到文件开头　数字G：第 n 行</text>
  <text x="450" y="354">Ctrl+r：重做上一次撤销</text>
  <text x="60" y="424">末行模式常用：<tspan font-weight="bold">:w</tspan> 保存　<tspan font-weight="bold">:q</tspan> 退出　<tspan font-weight="bold">:wq</tspan> 保存并退出　<tspan font-weight="bold">:q!</tspan> 不保存强制退出</text>
</svg>
