<svg xmlns="http://www.w3.org/2000/svg" width="860" height="510" viewBox="0 0 860 510" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0d1b2e">
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7b8ca0"/></marker></defs>
  <rect x="0" y="0" width="860" height="510" fill="#ffffff"/>
  <text x="30" y="34" font-size="15" font-weight="bold">用户与组：/etc/passwd 与 /etc/group</text>
  <rect x="40" y="60" width="780" height="88" rx="10" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="60" y="86" font-weight="bold" fill="#159A48">$ cat /etc/passwd</text>
  <text x="60" y="112"><tspan fill="#159A48" font-weight="bold">student</tspan><tspan fill="#7b8ca0"> : </tspan><tspan font-weight="bold">x</tspan><tspan fill="#7b8ca0"> : </tspan><tspan font-weight="bold">1000</tspan><tspan fill="#7b8ca0"> : </tspan><tspan font-weight="bold">1000</tspan><tspan fill="#7b8ca0"> : </tspan>Student<tspan fill="#7b8ca0"> : </tspan><tspan fill="#159A48">/home/student</tspan><tspan fill="#7b8ca0"> : </tspan><tspan fill="#159A48">/bin/bash</tspan></text>
  <text x="60" y="136" fill="#7b8ca0">用户名 : 密码占位(x) : UID : 主组 GID : 注释 : 家目录 : 登录 Shell</text>
  <rect x="40" y="160" width="780" height="88" rx="10" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="60" y="186" font-weight="bold" fill="#159A48">$ cat /etc/group</text>
  <text x="60" y="212"><tspan fill="#159A48" font-weight="bold">wheel</tspan><tspan fill="#7b8ca0"> : </tspan><tspan font-weight="bold">x</tspan><tspan fill="#7b8ca0"> : </tspan><tspan font-weight="bold">10</tspan><tspan fill="#7b8ca0"> : </tspan>student,alice</text>
  <text x="60" y="236" fill="#7b8ca0">组名 : 组密码占位 : GID : 以此组为附加组的用户列表</text>
  <text x="60" y="282" font-weight="bold">主组与附加组</text>
  <rect x="60" y="300" width="150" height="56" rx="10" fill="#0d1b2e"/>
  <text x="135" y="322" font-weight="bold" fill="#ffffff" text-anchor="middle">用户 student<tspan x="135" dy="20" fill="#E8F7EE" font-weight="normal">uid=1000</tspan></text>
  <rect x="320" y="290" width="270" height="50" rx="8" fill="#E8F7EE" stroke="#159A48" stroke-width="2"/>
  <text x="455" y="310" font-weight="bold" text-anchor="middle">主组：student（GID 1000）<tspan x="455" dy="18" font-weight="normal" fill="#7b8ca0">建用户时自动创建同名组</tspan></text>
  <rect x="320" y="352" width="270" height="50" rx="8" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="455" y="372" font-weight="bold" text-anchor="middle">附加组：wheel（GID 10）<tspan x="455" dy="18" font-weight="normal" fill="#7b8ca0">加入后可执行 sudo 提权</tspan></text>
  <rect x="320" y="414" width="270" height="50" rx="8" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="455" y="434" font-weight="bold" text-anchor="middle">附加组：adm（GID 4）<tspan x="455" dy="18" font-weight="normal" fill="#7b8ca0">可读取 /var/log 日志</tspan></text>
  <line x1="212" y1="328" x2="316" y2="315" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="212" y1="328" x2="316" y2="377" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="212" y1="328" x2="316" y2="439" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="630" y="340" font-weight="bold" fill="#159A48">一个用户：只有 1 个主组<tspan x="630" dy="22" font-weight="normal" fill="#0d1b2e">可同时属于多个附加组</tspan></text>
  <text x="40" y="494">id student 查看所属组；usermod -aG wheel student 追加附加组；usermod -g 组名 用户 改主组。</text>
</svg>
