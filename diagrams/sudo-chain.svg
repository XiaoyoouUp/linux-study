<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0d1b2e">
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7b8ca0"/></marker></defs>
  <rect x="0" y="0" width="860" height="470" fill="#ffffff"/>
  <text x="30" y="34" font-size="15" font-weight="bold">sudo 授权链：从普通用户到临时 root 权限</text>
  <rect x="30" y="70" width="200" height="74" rx="10" fill="#0d1b2e"/>
  <text x="130" y="98" text-anchor="middle" fill="#ffffff" font-weight="bold">student 普通用户<tspan x="130" dy="20" fill="#E8F7EE" font-weight="normal">$ sudo dnf install httpd</tspan></text>
  <line x1="232" y1="107" x2="270" y2="107" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="274" y="62" width="250" height="92" rx="10" fill="#E8F7EE" stroke="#159A48" stroke-width="2"/>
  <text x="399" y="88" text-anchor="middle" font-weight="bold">授权判定<tspan x="399" dy="22" font-weight="normal">① 用户在 wheel 组？</tspan><tspan x="399" dy="20" font-weight="normal">② 匹配 sudoers 规则？</tspan></text>
  <text x="536" y="82" fill="#159A48" font-weight="bold">允许</text>
  <line x1="526" y1="95" x2="574" y2="95" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="578" y="52" width="252" height="90" rx="10" fill="#0d1b2e"/>
  <text x="704" y="78" text-anchor="middle" fill="#ffffff" font-weight="bold">临时获得 root 权限<tspan x="704" dy="22" fill="#E8F7EE" font-weight="normal">以 root 身份执行命令</tspan><tspan x="704" dy="20" fill="#7b8ca0">执行记录写入 /var/log/secure</tspan></text>
  <text x="536" y="176" fill="#c53030" font-weight="bold">拒绝</text>
  <line x1="526" y1="132" x2="574" y2="196" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="578" y="170" width="252" height="70" rx="10" fill="#ffffff" stroke="#c53030" stroke-width="2"/>
  <text x="704" y="196" text-anchor="middle" fill="#c53030" font-weight="bold">拒绝执行并告警<tspan x="704" dy="20" font-weight="normal">不在 sudoers 清单，事件将被报告</tspan></text>
  <rect x="30" y="200" width="400" height="96" rx="10" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="50" y="228" fill="#159A48" font-weight="bold">$ sudo visudo　# 唯一安全的编辑方式<tspan x="50" dy="22" fill="#0d1b2e">/etc/sudoers：%wheel  ALL=(ALL)  ALL</tspan><tspan x="50" dy="20" fill="#7b8ca0">允许 wheel 组成员用 sudo 提权任意命令</tspan></text>
  <line x1="330" y1="200" x2="399" y2="158" stroke="#7b8ca0" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <text x="408" y="184" fill="#7b8ca0">sudoers 是授权来源</text>
  <text x="30" y="322" fill="#c53030">visudo 保存前做语法检查，避免改错导致无人能提权</text>
  <rect x="470" y="290" width="360" height="76" rx="10" fill="#E8F7EE" stroke="#159A48" stroke-width="2"/>
  <text x="490" y="316" font-weight="bold">排查与记录<tspan x="490" dy="20" font-weight="normal">$ sudo -l　查看自己被授权的命令</tspan><tspan x="490" dy="20" fill="#7b8ca0">提权记录见 /var/log/secure</tspan></text>
  <text x="30" y="448" fill="#7b8ca0">wheel 组身份用 usermod -aG wheel student 授予；授权链 = wheel 组身份 + /etc/sudoers 规则。</text>
</svg>
