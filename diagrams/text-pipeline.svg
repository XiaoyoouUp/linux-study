<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#0d1b2e">
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7b8ca0"/></marker></defs>
  <rect x="0" y="0" width="860" height="400" fill="#ffffff"/>
  <text x="30" y="34" font-size="15" font-weight="bold">管道文本处理流水线：过滤 → 编辑 → 取列</text>
  <rect x="40" y="90" width="130" height="60" rx="8" fill="#ffffff" stroke="#7b8ca0" stroke-width="1.5"/>
  <text x="105" y="114" font-weight="bold" text-anchor="middle">原始文本<tspan x="105" dy="22" font-weight="normal" fill="#7b8ca0">文件 / 命令输出</tspan></text>
  <rect x="215" y="90" width="140" height="60" rx="8" fill="#E8F7EE" stroke="#159A48" stroke-width="2"/>
  <text x="285" y="114" font-weight="bold" text-anchor="middle">grep<tspan x="285" dy="22" font-weight="normal">按行过滤</tspan></text>
  <rect x="395" y="90" width="140" height="60" rx="8" fill="#E8F7EE" stroke="#159A48" stroke-width="1.5"/>
  <text x="465" y="114" font-weight="bold" text-anchor="middle">sed<tspan x="465" dy="22" font-weight="normal">按行编辑</tspan></text>
  <rect x="575" y="90" width="140" height="60" rx="8" fill="#E8F7EE" stroke="#159A48" stroke-width="1.5"/>
  <text x="645" y="114" font-weight="bold" text-anchor="middle">awk<tspan x="645" dy="22" font-weight="normal">按列取值</tspan></text>
  <rect x="745" y="90" width="85" height="60" rx="8" fill="#0d1b2e"/>
  <text x="787" y="114" font-weight="bold" fill="#ffffff" text-anchor="middle">输出<tspan x="787" dy="22" fill="#E8F7EE" font-weight="normal">屏幕/文件</tspan></text>
  <line x1="172" y1="120" x2="211" y2="120" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="357" y1="120" x2="391" y2="120" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="537" y1="120" x2="571" y2="120" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="717" y1="120" x2="741" y2="120" stroke="#7b8ca0" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="105" y="190" text-anchor="middle" fill="#159A48">cat /etc/passwd<tspan x="105" dy="20" fill="#7b8ca0">几十行用户记录</tspan></text>
  <text x="285" y="190" text-anchor="middle" fill="#159A48">grep 'bash$'<tspan x="285" dy="20" fill="#7b8ca0">只留以 bash 结尾的行</tspan></text>
  <text x="465" y="190" text-anchor="middle" fill="#159A48">sed 's/root/ROOT/'<tspan x="465" dy="20" fill="#7b8ca0">每行首个 root 改大写</tspan></text>
  <text x="645" y="190" text-anchor="middle" fill="#159A48">awk -F: '{print $1}'<tspan x="645" dy="20" fill="#7b8ca0">以冒号分列，取第 1 列</tspan></text>
  <text x="787" y="190" text-anchor="middle" fill="#159A48">student<tspan x="787" dy="20" fill="#7b8ca0">一行一个用户名</tspan></text>
  <rect x="40" y="248" width="780" height="96" rx="10" fill="#E8F7EE" stroke="#159A48" stroke-width="1.5"/>
  <text x="60" y="276" font-weight="bold">组合成一条命令（用 | 把前一个的输出接到后一个的输入）</text>
  <text x="60" y="302" fill="#159A48" font-weight="bold">cat /etc/passwd | grep 'bash$' | awk -F: '{print $1}'</text>
  <text x="60" y="326" fill="#7b8ca0">输出：所有登录 Shell 为 bash 的用户，一行一个。</text>
</svg>
