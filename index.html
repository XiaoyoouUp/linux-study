<!DOCTYPE html>

  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="课程导航">
      <a class="brand" href="#/">
        <svg viewBox="0 0 100 100" width="30" height="30" aria-hidden="true"><rect x="4" y="4" width="92" height="92" rx="20" fill="#0d1b2e"/><text x="50" y="66" font-size="48" font-family="monospace" fill="#159A48" text-anchor="middle">&gt;_</text></svg>

      </a>
      <nav id="nav"></nav>
      <div id="nav-progress" class="nav-progress"></div>
    </aside>
    <div id="main-wrap">
      <header id="topbar">
        <button id="menu-btn" aria-label="打开导航">☰</button>
        <div id="breadcrumb"></div>
        <div id="topbar-right">
          <div class="width-ctrl" id="width-ctrl" title="调整内容区宽度">
            <button data-w="narrow" type="button">标准</button>
            <button data-w="wide" type="button">宽</button>

  <script type="module" src="./js/app.js"></script>
  <script>
    /* file:// 下 ES 模块被浏览器 CORS 拦截，app.js 不会执行；用经典脚本给出明确指引 */
    if (location.protocol === 'file:') {
      document.getElementById('content').innerHTML =
        '<div class="exam-cover" style="margin-top:40px"><div class="icon">📄</div><h1>请通过本地服务访问</h1>' +
        '<p style="color:var(--ink-2);line-height:2">浏览器安全策略禁止在 <code>file://</code> 下加载 ES 模块，所以页面只剩外壳。<br>' +
        '在项目根目录运行 <code>npx serve -l 8080 .</code>（或双击 <code>start.bat</code>），<br>然后浏览器访问 <code>http://localhost:8080</code>。</p></div>';
    }
  </script>
